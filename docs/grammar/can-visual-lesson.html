function tokens(parts){return '<div class="english" lang="en">'+parts.map((v,i)=>'<span class="word '+(v.toLowerCase()==='can'?'can':i===2?'act':'person')+'">'+v+'</span>').join(' ')+'</div>'}
const legend='<div class="legend"><span class="word can">can</span><span class="word person">누가·무엇이</span><span class="word act">행동·상태</span></div>';

 ['수영장에서 만나는 can','오늘은 능력을 묻는 말과 허락을 구하는 말을 비교해요. 지도에서 장면을 눌러 다른 쓰임도 살펴보세요.',()=>'<div id="firstMap"></div>'+why('왜 can에 뜻이 여러 개예요?','우리말 “할 수 있어?”도 수영 수업에서는 실력을, 상자를 든 친구 앞에서는 도움을 묻는 말이 될 수 있어요. 누가 누구에게 어떤 반응을 기대하는지 살펴보세요.')],
 ['같은 수영, 다른 질문','왼쪽에서는 선생님이 묻고, 오른쪽에서는 지우가 물어요. 물에 들어갈 사람은 두 장면 모두 지우예요.',()=>legend+'<div class="grid wrap">'+card(0)+card(1)+'</div>'+pick('지우는 수영을 잘해요. 그런데 왜 물에 들어가기 전에 선생님께 “Can I swim now?”(이제 수영해도 돼요?)라고 물었을까요?', [['지금 물에 들어가도 되는지 선생님의 허락을 받고 싶어요.','right','할 줄 알아도 지금 해도 되는지는 따로 물을 수 있어요.'],['자기 실력이 어느 정도인지 궁금해요.','wrong','지우는 이미 수영할 줄 알아요. 지금 물에 들어가도 될지는 선생님이 알려 줄 수 있어요. 다시 골라 보세요.']])],
 ['내 말에서 질문 만들기','지우가 자기 실력을 말해요. 선생님은 같은 행동을 지우에게 물어보려고 해요.',()=>'<div class="grid wrap"><article class="card"><div class="role">지우의 말</div>'+tokens(['I','can','swim.'])+'나는 수영할 줄 알아.</article><article class="card"><div class="role">선생님이 지우를 보며</div>'+tokens(['You','can','swim.'])+'너는 수영할 줄 알아.</article></div><div class="exercise"><h3>“너 수영할 줄 아니?” 조각을 순서대로 눌러 보세요.</h3><div class="btns" id="tiles"></div><p id="line" lang="en" class="english"></p><button id="undo">다시 놓기</button><p id="tileFb" role="status"></p></div>'+why('왜 질문에 Do를 붙이지 않아요?','You swim.에는 can이 없어 기본 질문을 만들 때 Do you swim?이라고 해요. You can swim.에는 이미 can이 있어서 can을 앞으로 보내면 Can you swim?이 돼요.')],
 ['같은 한마디, 다른 두 장면','Can you open this door? 두 사람 모두 같은 말을 해요. 먼저 그림에서 손과 문손잡이를 살펴보세요.',()=>'<div class="grid wrap">'+[['손의 움직임을 확인하는 치료사','치료사 → 손목을 다친 학생','손목 보호대를 찬 학생이 손잡이를 돌려 봐요. 치료사는 혼자 할 수 있는지 살펴봐요.','left'],['상자를 옮기는 친구','양손에 짐을 든 친구 → 문 옆의 학생','상자를 든 채로는 손잡이를 잡기 어려워요. 친구가 문 옆의 학생과 눈을 맞춰요.','right']].map(([title,who,scene,side])=>'<article class="card"><div class="sceneimg" role="img" aria-label="'+title+'" style="background-image:url('+assets.door+');background-position:'+side+'"></div><div class="role">'+who+'</div><h2>'+title+'</h2><p>'+scene+'</p>'+tokens(['Can','you','open this door?'])+'</article>').join('')+'</div>'+pick('친구가 “응, 열 수 있어”라고만 하고 지나가면 누가 여전히 곤란할까요?', [['치료사','wrong','치료사는 학생의 손 움직임을 확인하려고 해요. 어느 장면에서 말한 사람의 두 손이 이미 꽉 차 있나요?'],['상자를 든 친구','right','친구가 바란 것은 실제로 문이 열리는 일이에요. 같은 문장도 장면 속에서 부탁이 될 수 있어요.']])+why('왜 please가 없어도 부탁이에요?','please는 부탁에 공손함을 더할 수 있어요. 이 장면에서는 상자를 든 손, 닫힌 문, 친구를 바라보는 모습만으로도 왜 물었는지 짐작할 수 있어요.')],
 ['내가 원하는 대답 얻기','지우는 혼자 수영할 줄 알지만 요즘은 농구를 해요. 민서는 매주 수영하지만 선생님이 잡아 줘야 해요.',()=>pick('학교 신문에 민서가 매주 하는 운동을 쓰려고 해요. 어떤 질문을 건넬까요?', [['Can you swim on your own?','wrong','민서 “아직 혼자서는 못 해.” 실력은 알았어요. 이 답으로 토요일마다 무엇을 하는지도 알 수 있을까요? 다시 물어보세요.'],['Do you swim every Saturday?','right','민서 “응, 토요일마다 연습해.” 이제 신문에 민서의 주말 운동을 쓸 수 있어요.']])+'<div class="exercise"><h3>수영장에 먼저 들어가고 싶은 사람은 나예요.</h3><label class="task">swim(수영하다), now(지금)를 써서 선생님에게 물어보세요.<textarea id="guided" rows="2"></textarea></label><button id="peek" disabled>내 문장과 비교하기</button><div id="guidedModel" hidden>'+tokens(['Can','I','swim now?'])+'I는 물에 들어가려는 나예요. 상대의 허락을 기다려요.</div></div>'+why('왜 선생님 대답은 Yes, you can.이에요?','내가 나를 I라고 부르지만 선생님은 나를 보며 you라고 불러요. 둘 다 물에 들어가려는 같은 사람을 가리켜요.')],
 ['처음 가 본 사진 전시회','사진 동아리 친구와 전시회에 왔어요. 각 상황에서 건넬 영어 질문을 직접 쓰세요. 세 질문을 먼저 쓴 뒤 예시와 비교할 수 있어요.',()=>'<div class="exercise">'+['친구가 사진을 잘 찍을 줄 아는지 알아보고 싶어요.','전시장 안에서 내가 사진을 찍어도 되는지 직원에게 물어요.','친구와 함께 서서 지나가는 사람에게 우리 사진 한 장을 찍어 달라고 해요.'].map((s,i)=>'<label class="task">'+(i+1)+'. '+s+'<textarea class="draft" rows="2"></textarea></label>').join('')+'<button id="compare" disabled>내 질문과 예시 비교하기</button><div id="review" hidden><h2>상대에게 어떻게 들릴까요?</h2>'+['Can you take good photos? · 사진을 잘 찍을 줄 알아?','Can I take photos here? · 여기서 사진을 찍어도 되나요?','Can you take a photo of us? · 저희 사진 좀 찍어 주실래요?'].map(s=>'<p>'+s+'</p>').join('')+why('왜 첫째와 셋째는 둘 다 Can you로 시작해요?','첫째에서는 “응, 잘 찍어”라는 정보가 필요해요. 셋째에서는 우리 사진을 실제로 찍어 줘야 부탁이 이루어져요. 네가 쓴 표현이 조금 달라도 상대가 해 줄 대답이나 행동이 맞는지 비교해 보세요.')+'</div></div>'+why('왜 예시를 나중에 봐요?','네가 원하는 말을 먼저 떠올려 보는 시간이에요. 쓰고 난 뒤에는 문장을 한 글자씩 맞추기보다 상대에게 네 의도가 제대로 전해질지 살펴보세요.')]
];
let idx=0;const stage=$('#stage');
pages.forEach(([title,desc,content],i)=>{const el=document.createElement('article');el.hidden=i!==0;el.innerHTML='<h1 tabindex="-1">'+title+'</h1><p>'+desc+'</p><div class="wrap">'+content()+'</div>';stage.append(el)});
const nodes=[...stage.children];map($('#firstMap'));map($('#dialogMap'));
for(const box of [$('#firstMap'),$('#dialogMap')]){
  box.insertAdjacentHTML('beforeend',why('더 보기 · can’t도 장면마다 다를까요?',
    '민서가 I can’t swim on my own yet.이라고 하면 “아직 혼자 수영을 못 해”라는 능력 이야기예요. 안전요원이 You can’t swim here.라고 하면 “여기서는 수영하면 안 돼”라는 규칙일 수 있어요. 멀리 있는 집을 가리키며 That can’t be my house.라고 하면 “저게 우리 집일 리 없어”라는 판단이에요. 누가 무엇을 보고 하는 말인지 함께 살펴보세요.'));
}
$('#mapOpen').onclick=()=>$('#atlas').showModal();$('#close').onclick=()=>$('#atlas').close();
document.querySelectorAll('[data-feedback]').forEach(b=>b.onclick=()=>{const e=b.closest('.exercise');e.querySelectorAll('[data-feedback]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));const message=e.querySelector('.feedback');message.dataset.result=b.dataset.result;message.textContent=(b.dataset.result==='right'?'✓ 맞아요. ':'✕ 아니에요. ')+b.dataset.feedback});
const labels=['swim','Can','you'];const chosen=[];
function tiles(){const box=$('#tiles');box.replaceChildren();labels.forEach(v=>{let b=document.createElement('button');b.textContent=v;b.disabled=chosen.includes(v);b.onclick=()=>{chosen.push(v);tiles()};box.append(b)});$('#line').textContent=chosen.join(' ')+(chosen.length===3?'?':'');$('#tileFb').textContent=chosen.length!==3?'':chosen.join(' ')==='Can you swim'?'맞아요. can을 앞으로 옮겼고, you와 swim은 원래 순서를 지켰어요.':'먼저 You can swim.을 떠올려 보세요. can만 앞으로 보내고 다시 놓아 보세요.'}
$('#undo').onclick=()=>{chosen.length=0;tiles()};tiles();
function gate(fields,btn,model){fields.forEach(f=>f.oninput=()=>btn.disabled=!fields.every(x=>x.value.trim()));btn.onclick=()=>{model.hidden=false;btn.hidden=true}}
gate([$('#guided')],$('#peek'),$('#guidedModel'));gate([...document.querySelectorAll('.draft')],$('#compare'),$('#review'));
function show(i,focus){idx=i;nodes.forEach((n,j)=>n.hidden=i!==j);$('#count').textContent=(i+1)+' / 6단계';$('progress').value=i+1;$('#prev').disabled=i===0;$('#next').textContent=i===5?'첫 장면 다시 보기':'다음 단계 →';if(focus){nodes[i].querySelector('h1').focus();window.scrollTo(0,0)}}
$('#prev').onclick=()=>show(idx-1,true);$('#next').onclick=()=>show((idx+1)%6,true);show(0,false);
</script></html>
